<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById('reports-data').textContent);
  var TYPES = {
    stock:     {label:'個股',   plural:'個股研究'},
    chain:     {label:'產業鏈', plural:'產業鏈'},
    commodity: {label:'商品',   plural:'商品研究'}
  };

  var state = {q:'', type:'all', sort:'date-desc', view:'grid'};

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function href(f){ return encodeURIComponent(f); }
  function kb(n){ if(!n) return ''; return n>=1048576 ? (n/1048576).toFixed(1)+' MB' : Math.round(n/1024)+' KB'; }
  function hay(r){ return [r.code,r.ticker,r.name,r.summary,r.market,r.sector,r.file,(r.tags||[]).join(' '),
                           (TYPES[r.type]||{}).label].join(' ').toLowerCase(); }

  /* ---- stats ---- */
  (function(){
    var byType = {stock:0,chain:0,commodity:0};
    DATA.forEach(function(r){ if(byType[r.type]!=null) byType[r.type]++; });
    var latest = DATA.map(function(r){return r.date;}).filter(Boolean).sort().pop() || '—';
    var cells = [
      {k:'報告總數', v:DATA.length, u:'份'},
      {k:'個股研究', v:byType.stock, u:'檔'},
      {k:'產業鏈 / 商品', v:byType.chain+byType.commodity, u:'篇'},
      {k:'最新資料日期', v:latest, u:''}
    ];
    document.getElementById('stats').innerHTML = cells.map(function(c){
      return '<div class="stat"><span class="k">'+esc(c.k)+'</span><span class="v">'+esc(c.v)+
             (c.u?'<small>'+esc(c.u)+'</small>':'')+'</span></div>';
    }).join('');
  })();

  /* ---- type chips ---- */
  (function(){
    var counts = {all:DATA.length};
    DATA.forEach(function(r){ counts[r.type]=(counts[r.type]||0)+1; });
    var order = ['all'].concat(Object.keys(TYPES).filter(function(t){return counts[t];}));
    document.getElementById('typechips').innerHTML = order.map(function(t){
      var label = t==='all' ? '全部' : TYPES[t].label;
      return '<button class="chip" type="button" data-type="'+t+'" aria-pressed="'+(t==='all')+'">'+
             esc(label)+'<span class="n">'+counts[t]+'</span></button>';
    }).join('');
  })();

  /* ---- render ---- */
  function filtered(){
    var q = state.q.trim().toLowerCase();
    var terms = q ? q.split(/\s+/) : [];
    var out = DATA.filter(function(r){
      if(state.type!=='all' && r.type!==state.type) return false;
      if(!terms.length) return true;
      var h = hay(r);
      return terms.every(function(t){ return h.indexOf(t)>-1; });
    });
    out.sort(function(a,b){
      switch(state.sort){
        case 'date-asc':  return (a.date||'').localeCompare(b.date||'');
        case 'code':      return (a.code||'zzzz').localeCompare(b.code||'zzzz');
        case 'name':      return (a.name||'').localeCompare(b.name||'','zh-Hant');
        default:          return (b.date||'').localeCompare(a.date||'');
      }
    });
    return out;
  }

  function cardHTML(r){
    var t = TYPES[r.type] || {label:r.type};
    var badge = r.code
      ? '<span class="bcode">'+esc(r.code)+'</span>'
      : '<span class="bcode alt">'+esc(t.label)+'</span>';
    var seen = {}; seen[t.label] = !r.code;   /* 類型徽章已顯示時不再重複 */
    var meta = [r.market, r.sector].filter(function(x){
      if(!x || seen[x]) return false; seen[x]=1; return true; });
    return '<a class="card rpt" href="'+href(r.file)+'">'+
      '<div class="rpt-top">'+badge+
        meta.map(function(x){return '<span class="bmk">'+esc(x)+'</span>';}).join('')+
        '<span class="rdate">'+esc(r.date||'')+'</span></div>'+
      '<h3>'+esc(r.name)+(r.ticker?'<span class="tick">'+esc(r.ticker)+'</span>':'')+'</h3>'+
      '<p class="rsum">'+esc(r.summary)+'</p>'+
      '<div class="tags">'+(r.tags||[]).map(function(x){return '<span class="tag">'+esc(x)+'</span>';}).join('')+'</div>'+
      '<div class="rfoot"><span>HTML'+(r.bytes?' · '+kb(r.bytes):'')+'</span><span class="go">開啟報告 →</span></div>'+
    '</a>';
  }

  function rowHTML(r){
    var t = TYPES[r.type] || {label:r.type};
    return '<tr>'+
      '<td class="tcode">'+esc(r.code||'—')+'</td>'+
      '<td class="tname"><a href="'+href(r.file)+'">'+esc(r.name)+'</a></td>'+
      '<td>'+esc(t.label)+'</td>'+
      '<td class="tsum">'+esc(r.summary)+'</td>'+
      '<td class="tdate">'+esc(r.date||'')+'</td></tr>';
  }

  function render(){
    var rows = filtered();
    document.getElementById('grid').innerHTML   = rows.map(cardHTML).join('');
    document.getElementById('tbody').innerHTML  = rows.map(rowHTML).join('');
    document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
    document.getElementById('grid').style.display      = (rows.length && state.view==='grid') ? '' : 'none';
    document.getElementById('tablewrap').style.display = (rows.length && state.view==='list') ? 'block' : 'none';
    document.getElementById('resultbar').innerHTML =
      '顯示 <b>'+rows.length+'</b> / '+DATA.length+' 份報告'+
      (state.q?' · 關鍵字「'+esc(state.q)+'」':'')+
      (state.type!=='all'?' · '+esc(TYPES[state.type].label):'');
    document.getElementById('qclear').style.display = state.q ? 'block' : 'none';
  }

  /* ---- events ---- */
  var qEl = document.getElementById('q');
  qEl.addEventListener('input', function(){ state.q = qEl.value; render(); });
  document.getElementById('qclear').addEventListener('click', function(){ qEl.value=''; state.q=''; qEl.focus(); render(); });
  document.getElementById('typechips').addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if(!b) return;
    state.type = b.dataset.type;
    [].forEach.call(this.querySelectorAll('.chip'), function(c){ c.setAttribute('aria-pressed', c===b); });
    render();
  });
  document.getElementById('sort').addEventListener('change', function(){ state.sort=this.value; render(); });
  function setView(v){
    state.view=v;
    document.getElementById('vgrid').setAttribute('aria-pressed', v==='grid');
    document.getElementById('vlist').setAttribute('aria-pressed', v==='list');
    render();
  }
  document.getElementById('vgrid').addEventListener('click', function(){ setView('grid'); });
  document.getElementById('vlist').addEventListener('click', function(){ setView('list'); });
  document.addEventListener('keydown', function(e){
    if(e.key==='/' && document.activeElement!==qEl){ e.preventDefault(); qEl.focus(); qEl.select(); }
    else if(e.key==='Escape' && document.activeElement===qEl){ qEl.value=''; state.q=''; render(); }
  });

  var bm = document.querySelector('meta[name="index-build"]');
  document.getElementById('buildstamp').textContent = bm ? '目錄更新 ' + bm.content : '';
  render();
})();
</script>
